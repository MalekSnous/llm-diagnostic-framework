name: CI

on:
  push:
    branches: [main]
  pull_request:

# No real LLM API is ever called: the test suite uses a deterministic mock
# client, so no secrets are required. Dummy keys are set only so that imports
# referencing env vars don't error.
env:
  OPENAI_API_KEY: dummy
  ANTHROPIC_API_KEY: dummy

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install (core + dev only, no heavy ML extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (black + isort)
        run: |
          black --check .
          isort --check-only .

      - name: Type check (mypy)
        run: mypy llm_diagnostic
        continue-on-error: true

      - name: Run tests with coverage
        run: pytest

      - name: Upload coverage HTML
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: htmlcov/
          if-no-files-found: ignore
